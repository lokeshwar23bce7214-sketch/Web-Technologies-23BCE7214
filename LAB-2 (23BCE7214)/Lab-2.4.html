<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Management System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(120deg, #e3f2fd, #fce4ec);
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.card {
    background: #ffffff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    margin-bottom: 30px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: 600;
    display: block;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #bbb;
}

input:focus {
    outline: none;
    border-color: #1976d2;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn-primary {
    background: #1976d2;
    color: white;
}

.btn-primary:hover {
    background: #125aa3;
}

.btn-danger {
    background: #d32f2f;
    color: white;
}

.btn-danger:hover {
    background: #a92828;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    background: #1976d2;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ccc;
    text-align: center;
}

tr:hover {
    background: #f1f1f1;
}

.action-btn {
    padding: 6px 12px;
    border-radius: 5px;
    background: #e53935;
    color: white;
    border: none;
}

.action-btn:hover {
    background: #b71c1c;
}

.clear-btn {
    margin-top: 15px;
    background: #424242;
    color: white;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>User Registration</h2>

        <form onsubmit="registerUser(event)">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="mobile">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password">
            </div>

            <button class="btn-primary" type="submit">Register</button>
        </form>
    </div>

    <div class="card">
        <h2>Registered Users</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="userTable"></tbody>
        </table>

        <button class="clear-btn" onclick="clearAllUsers()">Clear All Users</button>
    </div>

</div>

<script>
function registerUser(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const password = document.getElementById("password").value;

    if (!name || !email || !mobile || !password) {
        alert("All fields are mandatory");
        return;
    }

    if (mobile.length !== 10 || isNaN(mobile)) {
        alert("Mobile number must be 10 digits");
        return;
    }

    if (password.length < 6) {
        alert("Password must be minimum 6 characters");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];

    if (users.some(user => user.email === email)) {
        alert("Email already registered");
        return;
    }

    users.push({ name, email, mobile });
    localStorage.setItem("users", JSON.stringify(users));

    event.target.reset();
    displayUsers();
}

function displayUsers() {
    const users = JSON.parse(localStorage.getItem("users")) || [];
    const table = document.getElementById("userTable");
    table.innerHTML = "";

    users.forEach((user, index) => {
        table.innerHTML += `
        <tr>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.mobile}</td>
            <td>
                <button class="action-btn" onclick="deleteUser(${index})">Delete</button>
            </td>
        </tr>`;
    });
}

function deleteUser(index) {
    let users = JSON.parse(localStorage.getItem("users"));
    users.splice(index, 1);
    localStorage.setItem("users", JSON.stringify(users));
    displayUsers();
}

function clearAllUsers() {
    localStorage.removeItem("users");
    displayUsers();
}

displayUsers();
</script>

</body>
</html>
