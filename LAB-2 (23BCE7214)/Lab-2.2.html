<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio & Video Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(120deg, #fff3e0, #e3f2fd);
    padding: 30px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 30px;
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}

.card h3 {
    margin-bottom: 15px;
    color: #444;
}

audio, video {
    width: 100%;
    margin-top: 10px;
}

.time {
    margin-top: 10px;
    font-weight: 600;
    color: #555;
}
</style>
</head>

<body>

<div class="container">

<h2>HTML5 Audio & Video Player</h2>

<div class="card">
    <h3>🎵 Audio Player</h3>
    <audio id="audio" controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>
    <div class="time">
        Current Time: <span id="audioTime">0</span> sec
    </div>
</div>

<div class="card">
    <h3>🎬 Video Player</h3>
    <video id="video" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>
    <div class="time">
        Current Time: <span id="videoTime">0</span> sec
    </div>
</div>

</div>

<script>
const audio = document.getElementById("audio");
const video = document.getElementById("video");

audio.addEventListener("timeupdate", () => {
    document.getElementById("audioTime").innerText =
        audio.currentTime.toFixed(1);
});

video.addEventListener("timeupdate", () => {
    document.getElementById("videoTime").innerText =
        video.currentTime.toFixed(1);
});
</script>

</body>
</html>
