<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>City Weather Viewer</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #222;
    color: white;
}

/* Top Bar */
.header {
    background: #111;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

/* Layout */
.container {
    display: flex;
    height: calc(100vh - 60px);
}

/* Left Search Panel */
.search-panel {
    width: 300px;
    background: #333;
    padding: 20px;
}

.search-panel input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
}

.search-panel button {
    width: 100%;
    padding: 8px;
    background: #ff9800;
    border: none;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

/* Right Result Panel */
.result-panel {
    flex: 1;
    padding: 30px;
    background: #1c1c1c;
}

.weather-card {
    background: #2e2e2e;
    padding: 20px;
    width: 300px;
    border-radius: 6px;
}

.loading {
    color: #bbb;
}
</style>
</head>

<body>

<div class="header">Weather Information Dashboard</div>

<div class="container">

<div class="search-panel">
    <h3>Search City</h3>
    <input id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>
    <p id="status" class="loading"></p>
</div>

<div class="result-panel">
    <div id="result"></div>
</div>

</div>

<script>
const API_KEY = "6dcedd30bda56c9923fe932afe8423a7";
let cache = {}; // store previous results

async function getWeather(){

    const cityName = city.value.trim();
    if(!cityName) return;

    // Use cache if available
    if(cache[cityName]){
        display(cache[cityName], true);
        return;
    }

    status.textContent = "Fetching weather data...";

    try{
        const res = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=${API_KEY}&units=metric`
        );

        const data = await res.json();

        if(data.cod !== 200) throw new Error(data.message);

        cache[cityName] = data; // save to cache
        display(data,false);
        status.textContent = "";

    }catch(err){
        status.textContent = "Error: " + err.message;
        result.innerHTML = "";
    }
}

function display(data,fromCache){

result.innerHTML = `
<div class="weather-card">
<h2>${data.name}</h2>
<p>Temperature: ${data.main.temp} °C</p>
<p>Humidity: ${data.main.humidity}%</p>
<p>Condition: ${data.weather[0].description}</p>
${fromCache ? "<small>(Loaded from cache)</small>" : ""}
</div>
`;
}
</script>

</body>
</html>
