<!DOCTYPE html>
<html>
<head>
  <title>Blog Feed</title>
  <style>
    body {
      font-family: "Segoe UI";
      background: linear-gradient(120deg, #84fab0, #8fd3f4);
      padding: 20px;
    }

    .post {
      background: white;
      margin: 15px auto;
      padding: 15px;
      width: 400px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h2>Blog Feed</h2>
<p id="load">Loading...</p>
<div id="posts"></div>

<script>
fetch("https://jsonplaceholder.typicode.com/posts")
.then(res => res.json())
.then(data => {
  document.getElementById("load").innerText = "";

  data.slice(0,5).forEach(p => {
    let d = document.createElement("div");
    d.className = "post";
    d.innerHTML = `<h3>${p.title}</h3><p>${p.body}</p>`;
    document.getElementById("posts").appendChild(d);
  });
})
.catch(() => {
  document.getElementById("load").innerText = "Error fetching posts";
});
</script>

</body>
</html>
